
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>最新影片偵測 | 穆頭</title>

<style>
body {
  margin:0; padding:0; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; color:#fff;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://i.ibb.co/8Lt7zDDY/IMG-1409.webp') no-repeat center top;
  background-size: cover; background-attachment: fixed; min-height: 100vh;
}

/* --- 修改：左上角純文字連結 --- */
.latest-link {
  position: fixed; 
  top: 25px; 
  left: 25px; 
  color: rgba(255, 255, 255, 0.8) !important; 
  text-decoration: none; 
  font-weight: bold;
  font-size: 16px;
  z-index: 1000;
  transition: 0.3s;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
}
.latest-link:hover {
  color: #fff !important;
  text-shadow: 0 0 10px rgba(255,255,255,0.8);
  transform: translateY(-2px);
}

.content { padding: 20px; max-width: 800px; margin: 0 auto; }
.title {
  text-align:center; font-size: 36px; font-weight:bold; margin: 80px 0 40px;
  text-shadow: 3px 3px 5px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
}
details, .video-box {
  background-color: rgba(0,0,0,0.85); border-radius:15px; padding:20px;
  width: 90%; max-width: 500px; margin: 0 auto 25px; border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
}
summary { font-weight:bold; cursor:pointer; font-size:20px; text-shadow: 2px 2px 4px #000; }
.button-container { text-align:center; }
.social-button {
  display:inline-flex; align-items:center; justify-content:center;
  background-color:#222; color:#fff !important; text-decoration:none; border-radius:12px;
  padding:15px; width:85%; max-width:320px; margin:10px auto; font-size:17px;
  font-weight: bold; border: 1px solid #444; transition: 0.3s ease;
}
.yt-btn:hover { background-color: #ff0000 !important; }
.dc-btn:hover { background-color: #5865f2 !important; }
.ig-btn:hover { background-color: #e1306c !important; }
.social-button img { height:24px; margin-right:12px; }

.video-container {
  position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 10px; background: #000;
}
.video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:none; }
</style>

</head>
<body>
  <div class="content">
    <div class="title" style="font-size:28px;">🎬 最新影片發布</div>
    <div class="video-box" style="text-align:center;">
      <div id="status">正在同步 YouTube 數據...</div>
      <div id="video-wrapper" class="video-container" style="display:none; margin-top:15px;">
        <iframe id="latest-iframe" src="" allowfullscreen></iframe>
      </div>
      <h3 id="video-title" style="margin-top:15px; font-size:18px;"></h3>
      <a id="video-link" href="#" target="_blank" style="color:#ff4444; font-weight:bold; text-decoration:none; display:none;">在 YouTube 上觀看 ↗</a>
    </div>
    <div style="text-align:center;"><a href="index.html" style="color:#aaa; text-decoration:none; font-size:14px;">← 回到首頁</a></div>
  </div>
  <script>
    async function fetchLatest() {
      const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=UCG_FPYIR8ies9lxyjNk-O8g`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        if (data.status === 'ok' && data.items.length > 0) {
          const latest = data.items[0];
          const vId = latest.link.split('v=')[1];
          document.getElementById('status').innerText = "偵測到最新影片：";
          document.getElementById('video-title').innerText = latest.title;
          document.getElementById('latest-iframe').src = `https://www.youtube.com/embed/${vId}`;
          document.getElementById('video-link').href = latest.link;
          document.getElementById('video-link').style.display = "inline-block";
          document.getElementById('video-wrapper').style.display = "block";
        }
      } catch (e) { document.getElementById('status').innerText = "偵測失敗。"; }
    }
    window.onload = fetchLatest;
  </script>
</body>
</html>
